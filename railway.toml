[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build -w @sano/shared && npx prisma generate --schema=packages/api/prisma/schema.prisma && npm run build -w api"

[deploy]
startCommand = "node packages/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
